name: Deploy to Hugging Face Space

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-hf-space
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HF_SPACE_REPO: https://huggingface.co/spaces/ColettoGS/zico-agent
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clone Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "Missing required secret: HF_TOKEN"
            exit 1
          fi

          AUTHED_REMOTE="https://user:${HF_TOKEN}@${HF_SPACE_REPO#https://}"
          git clone "$AUTHED_REMOTE" hf-space

      - name: Ensure authenticated Hugging Face remote
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "Missing required secret: HF_TOKEN"
            exit 1
          fi

          cd hf-space
          AUTHED_REMOTE="https://user:${HF_TOKEN}@${HF_SPACE_REPO#https://}"
          git remote set-url origin "$AUTHED_REMOTE"

      - name: Sync tracked files from new_zico
        run: |
          git ls-files -z new_zico | tar --null -T - -cf /tmp/new_zico.tar

          find hf-space -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +

          tar -xf /tmp/new_zico.tar -C hf-space --strip-components=1

      - name: Commit and push if changed
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "Missing required secret: HF_TOKEN"
            exit 1
          fi

          cd hf-space
          AUTHED_REMOTE="https://user:${HF_TOKEN}@${HF_SPACE_REPO#https://}"
          git remote set-url origin "$AUTHED_REMOTE"
          git add -A

          if git diff --cached --quiet; then
            echo "No deployment changes detected"
            exit 0
          fi

          git commit -m "Deploy from GitHub Actions: ${GITHUB_SHA}"
          if ! git push origin main; then
            echo "Push to Hugging Face Space failed. Check whether HF_TOKEN is valid and has write access to ColettoGS/zico-agent."
            exit 1
          fi
